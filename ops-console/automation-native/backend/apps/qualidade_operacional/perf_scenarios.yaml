# Cenários de carga versionados — Qualidade EO

# Consumidos por backend/scripts/bench_qualidade_eo.py (espelho documental).

# Não contém dados pessoais.



version: 2

defaults:

  date_axis: auditoria

  grain: etapa

  repeats: 3



scenarios:

